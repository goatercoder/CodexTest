{% extends 'base.html' %}
{% block content %}
<h1>{{ 'Sign up' if mode=='signup' else 'Log in' }}</h1>
<form method="post">
{% if mode=='signup' %}<input name="username" placeholder="username" required>{% endif %}
<input name="email" type="email" placeholder="email" required>
<input name="password" type="password" placeholder="password" required>
<button>{{ 'Create account' if mode=='signup' else 'Login' }}</button>
</form>
<p>Or <a href="/auth/social/demo">social login (demo)</a></p>
{% endblock %}
